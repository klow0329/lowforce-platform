# Floor Plan's PDF-to-image conversion and booth auto-detection shell out to
# poppler-utils (pdftoppm, pdftotext) — see backend/src/utils/pdfFloorPlan.js.
# Neither Node nor Railway's default Nixpacks build installs this; it works
# locally only because the developer machine has poppler on PATH separately.
#
# First attempt used nixPkgs = ["poppler_utils"] — deployed clean, but a
# real functional test against production (uploading an actual PDF) still
# hit the same error, and the build logs showed no setup-phase/nix-install
# output at all, meaning the Nix package mechanism silently wasn't taking
# effect for reasons that weren't visible from the CLI's log output.
# Switched to aptPkgs — a plain `apt-get install`, the exact package name
# the error message and pdfFloorPlan.js's own comment already named.
[phases.setup]
aptPkgs = ["poppler-utils"]
